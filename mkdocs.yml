site_name: Seth Medina - Technical Writer/Editor
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - navigate.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  language: en
  font:
    text: Lato
    code: Roboto Mono
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
      primary: blue-grey
      accent: cyan
    - scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
      primary: blue-grey
      accent: cyan

nav:
    - Home: index.md
    - Technical Reference: DataAvailability_Snowflake.md
    - API / Developer Doc: AuthBridgeService.md
    - Installation & Configuration Guide: Act_ConnectLink_Install.md
    - Editorial Sample: MTS_Newsletter_Edits.md
    - Business Proposal: EZLinks_Capital_Proposal.md
    - About Me: AboutMe.md

extra:
    social:
        - icon: fontawesome/brands/github-alt
          link: https://github.com/medinast21
        - icon: fontawesome/brands/linkedin
          link: https://linkedin.com/in/sethtmedina

markdown_extensions:
    - pymdownx.highlight:
          anchor_linenums: true
    - pymdownx.inlinehilite
    - pymdownx.snippets
    - admonition
    - pymdownx.arithmatex:
          generic: true
    - footnotes
    - pymdownx.details
    - pymdownx.superfences
    - pymdownx.mark
    - attr_list
    - md_in_html
    - pymdownx.emoji:
        emoji_index: !!python/name:material.extensions.emoji.twemoji
        emoji_generator: !!python/name:materialx.emoji.to_svg

plugins:

copyright: |
  &copy; {YEAR} <a href="https://linkedin.com/in/sethtmedina" target="_blank" rel="noopener">Seth Medina</a>